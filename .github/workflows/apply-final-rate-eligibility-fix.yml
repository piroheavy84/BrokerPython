name: Apply final rate eligibility fix

on:
  push:
    branches: [fix/multibanca-product-parser]
    paths:
      - tools/apply_final_rate_eligibility_fix.py

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/multibanca-product-parser
          fetch-depth: 0
      - name: Apply patch
        run: python tools/apply_final_rate_eligibility_fix.py
      - name: Compile and test
        run: |
          python -m pip install pytest
          python -m py_compile api.py engines/broker_engine/broker_engine.py
          python -m pytest -q tests/test_product_repository_rate_variants.py tests/test_commercial_discount_calculator.py
      - name: Commit
        run: |
          if git diff --quiet -- api.py engines/broker_engine/broker_engine.py; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add api.py engines/broker_engine/broker_engine.py
          git commit -m "Corregge Fisso standard e verifiche sulla rata scontata"
          git push origin HEAD:fix/multibanca-product-parser
